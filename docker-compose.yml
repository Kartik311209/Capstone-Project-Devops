services:
  app-blue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "1.0.0"
    container_name: pulsetrack-blue
    environment:
      APP_VERSION: "1.0.0"
      DEPLOYMENT_TRACK: "blue"
      ENVIRONMENT: "local-compose"
    ports:
      - "8001:8000"
    restart: unless-stopped
    networks:
      - devops-net

  app-green:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "1.1.0-canary"
    container_name: pulsetrack-green
    environment:
      APP_VERSION: "1.1.0-canary"
      DEPLOYMENT_TRACK: "green-canary"
      ENVIRONMENT: "local-compose"
    ports:
      - "8002:8000"
    restart: unless-stopped
    networks:
      - devops-net

  canary-router:
    image: nginx:1.27-alpine
    container_name: pulsetrack-router
    ports:
      - "8080:80"
    volumes:
      - ./observability/nginx/canary.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-blue
      - app-green
    restart: unless-stopped
    networks:
      - devops-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: pulsetrack-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - devops-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: pulsetrack-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - devops-net

  loki:
    image: grafana/loki:3.3.2
    container_name: pulsetrack-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - devops-net

  promtail:
    image: grafana/promtail:3.3.2
    container_name: pulsetrack-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./samples:/var/log/pulsetrack:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge
