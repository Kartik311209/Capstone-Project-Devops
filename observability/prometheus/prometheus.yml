global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "pulsetrack-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app-blue:8000", "app-green:8000"]
        labels:
          service: "pulsetrack"
