groups:
  - name: pulsetrack-slo-alerts
    rules:
      - alert: PulseTrackInstanceDown
        expr: up{job="pulsetrack-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PulseTrack instance down ({{ $labels.instance }})"
          description: "Target has been unreachable for more than 1 minute."

      - alert: PulseTrackHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 1)
          ) > 0.02
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PulseTrack 5xx error rate above 2%"
          description: "Canary/Blue-Green SLO breached; trigger automated rollback."

      - alert: PulseTrackHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "PulseTrack P95 latency > 500ms"
          description: "Request latency exceeds SLO threshold."
