apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsetrack-sa
  namespace: pulsetrack
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulsetrack-reader
  namespace: pulsetrack
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulsetrack-reader-binding
  namespace: pulsetrack
subjects:
  - kind: ServiceAccount
    name: pulsetrack-sa
    namespace: pulsetrack
roleRef:
  kind: Role
  name: pulsetrack-reader
  apiGroup: rbac.authorization.k8s.io
