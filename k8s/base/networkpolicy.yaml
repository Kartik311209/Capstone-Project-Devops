apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulsetrack-netpol
  namespace: pulsetrack
spec:
  podSelector:
    matchLabels:
      app: pulsetrack
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
