apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pulsetrack-staging
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /metadata/name
        value: pulsetrack-staging
    target:
      kind: Namespace
      name: pulsetrack
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: pulsetrack
