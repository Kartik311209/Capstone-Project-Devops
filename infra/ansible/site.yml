---
- name: Harden Linux Nodes and Configure Container & Monitoring Runtime
  hosts: platform_nodes
  become: true
  vars:
    allowed_tcp_ports:
      - "22"
      - "80"
      - "443"
      - "8000"
      - "9100"

  tasks:
    - name: Update apt cache and install baseline security packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - ufw
          - fail2ban
        state: present
        update_cache: true

    - name: Create dedicated non-root deployment user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: docker
        append: true
        create_home: true

    - name: Configure UFW firewall rules
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ allowed_tcp_ports }}"

    - name: Enable UFW with default deny incoming policy
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Ensure fail2ban is running for SSH brute-force protection
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: Deploy Prometheus Node Exporter container
      community.docker.docker_container:
        name: node-exporter
        image: prom/node-exporter:v1.8.2
        state: started
        restart_policy: unless-stopped
        ports:
          - "9100:9100"
